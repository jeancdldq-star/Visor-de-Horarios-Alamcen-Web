<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Diario de Turnos MD - V.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* --- ESTILOS GENERALES Y SIMULACIÓN DE PAPEL --- */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            width: 96%;
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 85vh;
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        
        /* --- NUEVO: ESTILO PARA LA INFO DEL ARCHIVO --- */
        .info-archivo {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 0px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .instrucciones { text-align: center; color: #666; font-size: 16px; margin-bottom: 25px; }

        /* --- CONTROLES --- */
        .controles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        select {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            width: 220px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { background: #aaa !important; cursor: not-allowed; }
        
        /* Botones independientes para los 3 turnos */
        .btn-manana { background-color: #4CAF50; }
        .btn-tarde { background-color: #f39c12; }
        .btn-noche { background-color: #5e35b1; }
        .btn-imprimir { background-color: #2196F3; }
        
        input[type="file"] { display: none; }

        /* --- VISTA DE HORARIOS --- */
        #contenedor-horarios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 25px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .bloque-hora {
            background: white;
            padding: 10px;
            break-inside: avoid;
            font-size: 12px;
        }
        .hora-titulo {
            background-color: #CCFF00 !important;
            color: black;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 10px;
            display: inline-block;
            border-bottom: 2px solid black;
            min-width: 150px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        td {
            color: #000080;
            font-size: 12px;
            font-style: italic;
            padding: 6px 2px;
            vertical-align: top;
            border-bottom: 1px solid #ccc;
        }
        tr:last-child td { border-bottom: none; }
        
        .col-nombre { width: 40%; }
        .col-fin { width: 12%; font-weight: bold; }
        .col-sig { width: 22%; font-weight: bold; }

        /* --- ESTILOS PARA IMPRESIÓN --- */
        @media print {
            @page { margin: 3mm; }
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .app-container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            #contenedor-horarios { display: flex; flex-wrap: wrap; gap: 15px; }
            .bloque-hora { width: 30%; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="no-print">
        <h1>Visor Diario de Turnos</h1>
        
        <!-- Contenedor para mostrar sutilmente la fecha y el nombre del archivo -->
        <div id="info-archivo" class="info-archivo"></div>
        
        <div class="instrucciones">Elige el planificador según tu turno y sección</div>

        <div class="controles">
            <label style="font-weight: bold;">Filtrar por:</label>
            <select id="combo-seccion">
                <option value="CARRUSEL PK ALM.">CARRUSEL PK ALM.</option>
                <option value="CARRUSEL PC ALM.">CARRUSEL PC ALM.</option>
                <option value="DEVOLUCIONES ALM.">DEVOLUCIONES ALM.</option>
                <option value="EXPEDICIONES ALM.">EXPEDICIONES ALM.</option>
            </select>

            <label for="archivo-manana" class="btn btn-manana" id="lbl-manana">
                ☀️ Planificador Mañana
            </label>
            <input type="file" id="archivo-manana" accept=".xlsx, .xls">

            <label for="archivo-tarde" class="btn btn-tarde" id="lbl-tarde">
                ⛅ Planificador Tarde
            </label>
            <input type="file" id="archivo-tarde" accept=".xlsx, .xls">
            
            <label for="archivo-noche" class="btn btn-noche" id="lbl-noche">
                🌙 Planificador Noche
            </label>
            <input type="file" id="archivo-noche" accept=".xlsx, .xls">

            <button class="btn btn-imprimir" id="btn-imprimir" disabled onclick="window.print()">
                🖨️ Imprimir
            </button>
        </div>
    </div>

    <div id="contenedor-horarios"></div>
</div>

<script>
    // --- VARIABLES GLOBALES PARA LA MEMORIA ---
    let datosExcelCrudos = []; 
    let turnoActualElegido = ""; 

    const ABREVIACIONES = {
        "CARRUSEL PC ALM.": "CONF",
        "CARRUSEL PK ALM.": "PAQ",
        "EXPEDICIONES ALM.": "EXP",
        "DEVOLUCIONES ALM.": "DEVO"
    };

    function formatTime(val) {
        if (val === undefined || val === null || val === "") return "";
        if (typeof val === 'number') {
            let totalMinutes = Math.round(val * 24 * 60);
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
        let s = String(val).trim();
        if (s.includes(' ')) s = s.split(' ').pop();
        let match = s.match(/(\d{1,2}):(\d{2})/);
        if (match) return `${match[1].padStart(2, '0')}:${match[2]}`;
        return s;
    }

    function calcularMinutosLogicos(horaStr) {
        if (!horaStr) return 9999;
        let partes = horaStr.split(':');
        if (partes.length < 2) return 9999;
        let h = parseInt(partes[0]);
        let m = parseInt(partes[1]);
        let hLogica = (h - 6 + 24) % 24; 
        return hLogica * 60 + m; 
    }

    document.getElementById('combo-seccion').addEventListener('change', () => {
        if (datosExcelCrudos.length > 0 && turnoActualElegido !== "") {
            const nuevaSeccion = document.getElementById('combo-seccion').value.trim().toUpperCase();
            let datosListos = extraerDatos(datosExcelCrudos, nuevaSeccion, turnoActualElegido);
            renderizarPantalla(datosListos);
        } else {
            document.getElementById('contenedor-horarios').innerHTML = "";
            document.getElementById('btn-imprimir').disabled = true;
        }
    });

    document.getElementById('archivo-manana').addEventListener('change', (e) => manejarArchivo(e, 'manana'));
    document.getElementById('archivo-tarde').addEventListener('change', (e) => manejarArchivo(e, 'tarde'));
    document.getElementById('archivo-noche').addEventListener('change', (e) => manejarArchivo(e, 'noche'));

    function manejarArchivo(e, turno) {
        const file = e.target.files[0];
        if (!file) return;

        // Extraer la fecha y mostrar la información del archivo sutilmente
        const fechaHoy = new Date().toLocaleDateString('es-ES');
        document.getElementById('info-archivo').innerHTML = `📅 Fecha: <strong>${fechaHoy}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; 📁 Archivo: <strong>${file.name}</strong>`;

        const seccionElegida = document.getElementById('combo-seccion').value.trim().toUpperCase();
        const lblActivo = document.getElementById('lbl-' + turno);
        const txtOriginal = lblActivo.innerHTML;

        lblActivo.innerHTML = "⏳ Procesando...";
        lblActivo.style.pointerEvents = 'none';

        const reader = new FileReader();
        reader.onload = function(evento) {
            try {
                const data = new Uint8Array(evento.target.result);
                const workbook = XLSX.read(data, {type: 'array', cellDates: false});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
                
                const rows = rawRows.map(row => {
                    let newRow = {};
                    for (let key in row) newRow[key.trim().toLowerCase()] = row[key];
                    return newRow;
                });

                if (!rows[0].hasOwnProperty('nombre empleado') || !rows[0].hasOwnProperty('hora inicio') || !rows[0].hasOwnProperty('hora fin')) {
                    throw new Error("Faltan columnas requeridas en el Excel.");
                }

                datosExcelCrudos = rows;
                turnoActualElegido = turno;

                let datosListos = extraerDatos(datosExcelCrudos, seccionElegida, turnoActualElegido);

                renderizarPantalla(datosListos);
                document.getElementById('btn-imprimir').disabled = false;
            } catch (err) {
                console.error(err);
                alert("Error al procesar: " + err.message);
                document.getElementById('info-archivo').innerHTML = ""; // Limpiar si hay error
            } finally {
                lblActivo.innerHTML = txtOriginal;
                lblActivo.style.pointerEvents = 'auto';
                e.target.value = ''; 
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function extraerDatos(rows, seccionElegida, turno) {
        let df = rows.map(r => {
            let horaInicio = formatTime(r['hora inicio']);
            let horaFin = formatTime(r['hora fin']);
            
            let nombreBruto = String(r['nombre empleado']).trim().toUpperCase();
            let partesNombre = nombreBruto.split(/\s+/);
            if (partesNombre.length >= 3) partesNombre.pop(); 
            let nombre = partesNombre.join(' '); 

            let tareaRaw = r['sección tarea'] ? String(r['sección tarea']).trim().toUpperCase() : "";
            if (['NAN', 'NAT', 'NULL', 'NONE'].includes(tareaRaw)) tareaRaw = "";

            return {
                nombre: nombre,
                horaInicio: horaInicio,
                horaFin: horaFin,
                tarea: tareaRaw,
                minutosOrden: calcularMinutosLogicos(horaInicio)
            };
        }).filter(r => r.nombre !== "" && r.horaInicio !== "" && r.horaFin !== "");

        df.sort((a, b) => {
            if (a.nombre < b.nombre) return -1;
            if (a.nombre > b.nombre) return 1;
            return a.minutosOrden - b.minutosOrden;
        });

        df.forEach((r, i) => r.ordenGeneral = i);

        let empDataMap = {};
        df.forEach(r => {
            if (!empDataMap[r.nombre]) empDataMap[r.nombre] = [];
            empDataMap[r.nombre].push(r);
        });

        let dfFiltradoFinal = [];
        
        let umbralTarde = calcularMinutosLogicos("14:00");  
        let umbralNoche = calcularMinutosLogicos("22:00");  

        for (let emp in empDataMap) {
            let empRows = empDataMap[emp];
            
            for (let i = 1; i < empRows.length; i++) {
                if (empRows[i].tarea === "") empRows[i].tarea = empRows[i-1].tarea;
            }
            for (let i = empRows.length - 2; i >= 0; i--) {
                if (empRows[i].tarea === "") empRows[i].tarea = empRows[i+1].tarea;
            }

            if(empRows.length > 0 && empRows[0].tarea !== "") {
                let bloques = [];
                let bloqueActual = {
                    nombre: emp,
                    tarea: empRows[0].tarea,
                    horaTurno: empRows[0].horaInicio,
                    fin: empRows[0].horaFin,
                    ultimoOrden: empRows[0].ordenGeneral
                };

                for (let i = 1; i < empRows.length; i++) {
                    let fila = empRows[i];
                    if (fila.tarea === "") continue;

                    let minInicioFila = calcularMinutosLogicos(fila.horaInicio);
                    let minFinAnterior = calcularMinutosLogicos(bloqueActual.fin);
                    let saltoTiempo = minInicioFila - minFinAnterior;

                    if (fila.tarea === bloqueActual.tarea && saltoTiempo < 30) {
                        bloqueActual.fin = fila.horaFin;
                        bloqueActual.ultimoOrden = fila.ordenGeneral;
                    } else {
                        bloques.push(bloqueActual);
                        bloqueActual = {
                            nombre: emp,
                            tarea: fila.tarea,
                            horaTurno: fila.horaInicio,
                            fin: fila.horaFin,
                            ultimoOrden: fila.ordenGeneral
                        };
                    }
                }
                bloques.push(bloqueActual);

                bloques.forEach(b => {
                    if (b.tarea.includes(seccionElegida)) {
                        let tareasFuturas = empRows.filter(r => r.ordenGeneral > b.ultimoOrden && !r.tarea.includes(seccionElegida) && r.tarea !== "");
                        
                        let sigStr = "FIN TURNO";
                        if (tareasFuturas.length > 0) {
                            let futura = tareasFuturas[0];
                            let rawSig = futura.tarea;
                            sigStr = ABREVIACIONES[rawSig] || rawSig;

                            let minInicioFutura = calcularMinutosLogicos(futura.horaInicio);
                            let minFinActual = calcularMinutosLogicos(b.fin);

                            if (turno === 'manana' && minFinActual < umbralTarde && minInicioFutura >= umbralTarde) {
                                sigStr = "FIN TURNO";
                            } else if (turno === 'tarde' && minFinActual < umbralNoche && minInicioFutura >= umbralNoche) {
                                sigStr = "FIN TURNO";
                            }
                        }

                        let minutosInicio = calcularMinutosLogicos(b.horaTurno);
                        let minutosFin = calcularMinutosLogicos(b.fin);
                        
                        if (minutosFin === 0) minutosFin = 1440; 

                        let finMostrar = b.fin;
                        let horaTurnoMostrar = b.horaTurno;

                        if (turno === 'manana') {
                            if (minutosInicio < umbralTarde) {
                                if (minutosFin > umbralTarde) {
                                    finMostrar = "14:00"; 
                                }
                                dfFiltradoFinal.push({ nombre: b.nombre, horaTurno: horaTurnoMostrar, fin: finMostrar, sig: sigStr });
                            }
                        
                        } else if (turno === 'tarde') {
                            if (minutosFin > umbralTarde) {
                                if (minutosInicio < umbralTarde) horaTurnoMostrar = "14:00"; 
                                if (minutosFin > umbralNoche) finMostrar = "22:00"; 
                                
                                dfFiltradoFinal.push({ nombre: b.nombre, horaTurno: horaTurnoMostrar, fin: finMostrar, sig: sigStr });
                            }
                        
                        } else if (turno === 'noche') {
                            if (minutosFin > umbralNoche) {
                                if (minutosInicio < umbralNoche) horaTurnoMostrar = "22:00"; 
                                
                                dfFiltradoFinal.push({ nombre: b.nombre, horaTurno: horaTurnoMostrar, fin: finMostrar, sig: sigStr });
                            }
                        }
                    }
                });
            }
        }
        return dfFiltradoFinal;
    }

    function renderizarPantalla(datosParaPintar) {
        const contenedor = document.getElementById('contenedor-horarios');
        contenedor.innerHTML = "";

        if (datosParaPintar.length === 0) {
            contenedor.innerHTML = "<p style='text-align: center; color: #666; width: 100%; font-size: 18px;'>No hay nadie asignado a esta sección en este turno.</p>";
            return;
        }

        let turnos = {};
        datosParaPintar.forEach(r => {
            let h = r.horaTurno;
            if (!turnos[h]) turnos[h] = [];
            turnos[h].push(r);
        });

        let horasOrdenadas = Object.keys(turnos).sort((a, b) => {
            return calcularMinutosLogicos(a) - calcularMinutosLogicos(b);
        });

        horasOrdenadas.forEach(hora => {
            let listaDatos = turnos[hora];
            
            listaDatos.sort((a, b) => {
                let finA = calcularMinutosLogicos(a.fin);
                if (finA === 0) finA = 1440; 
                let finB = calcularMinutosLogicos(b.fin);
                if (finB === 0) finB = 1440;

                if (finA !== finB) return finA - finB;
                if (a.sig !== b.sig) return a.sig.localeCompare(b.sig);
                return a.nombre.localeCompare(b.nombre);
            });

            let divBloque = document.createElement('div');
            divBloque.className = 'bloque-hora';
            
            let sigHtml = '';
            listaDatos.forEach(d => {
                let textoSig = d.sig !== "FIN TURNO" ? `➔ Sig: ${d.sig}` : "";

                sigHtml += `
                    <tr>
                        <td class="col-nombre">- ${d.nombre}</td>
                        <td class="col-fin">Fin: ${d.fin}</td>
                        <td class="col-sig">${textoSig}</td>
                    </tr>
                `;
            });

            divBloque.innerHTML = `
                <div class="hora-titulo">${hora} H (${listaDatos.length} pers.)</div>
                <table>${sigHtml}</table>
            `;
            
            contenedor.appendChild(divBloque);
        });
    }
</script>

</body>
</html>
