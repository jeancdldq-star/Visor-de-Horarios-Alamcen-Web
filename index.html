<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Diario de Turnos MD - V.3</title>
    <!-- Librería incluida en el repositorio para funcionar sin internet; el CDN queda solo como respaldo -->
    <script src="xlsx.full.min.js"></script>
    <script>
        if (typeof XLSX === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
        }
    </script>
    <style>
        /* --- ESTILOS GENERALES Y SIMULACIÓN DE PAPEL --- */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            width: 96%;
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 85vh;
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        
        /* --- NUEVO: ESTILO PARA LA INFO DEL ARCHIVO --- */
        .info-archivo {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 0px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .instrucciones { text-align: center; color: #666; font-size: 16px; margin-bottom: 25px; }

        /* --- CONTROLES --- */
        .controles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        select {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            width: 220px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { background: #aaa !important; cursor: not-allowed; }
        
        /* Botones independientes para los 3 turnos */
        .btn-cargar { background-color: #4CAF50; }
        .btn-imprimir { background-color: #2196F3; }
        
        input[type="file"] { display: none; }

        /* --- CABECERA QUE SÍ SE IMPRIME (sección, turno y fecha) --- */
        .cabecera-impresa {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 15px;
            font-weight: bold;
            color: black;
            border-bottom: 2px solid black;
            padding: 0 0 6px 0;
            margin: 0 0 15px 0;
        }
        .cabecera-impresa:empty { display: none; }

        /* --- VISTA DE HORARIOS --- */
        #contenedor-horarios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 25px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .bloque-hora {
            background: white;
            padding: 10px;
            break-inside: avoid;
            font-size: 12px;
        }
        .hora-titulo {
            background-color: #CCFF00 !important;
            color: black;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 10px;
            display: inline-block;
            border-bottom: 2px solid black;
            min-width: 150px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        td {
            color: #000080;
            font-size: 12px;
            font-style: italic;
            padding: 6px 2px;
            vertical-align: top;
            border-bottom: 1px solid #ccc;
        }
        tr:last-child td { border-bottom: none; }
        
        .col-nombre { width: 40%; }
        .col-fin { width: 12%; font-weight: bold; white-space: nowrap; }
        .col-sig { width: 22%; font-weight: bold; white-space: nowrap; }

        /* --- RESUMEN DE MOVIMIENTOS (ÚLTIMA HOJA) --- */
        #contenedor-resumen {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 3px dashed #999;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .resumen-titulo {
            font-size: 16px;
            font-weight: bold;
            color: black;
            margin: 0 0 4px 0;
        }
        .resumen-subtitulo { font-size: 12px; color: #666; margin: 0 0 15px 0; }
        .resumen-grid + .resumen-titulo { margin-top: 25px; }
        .aviso-nota {
            font-size: 11px;
            font-weight: bold;
            color: black;
            padding: 4px 10px 0 10px;
        }
        .aviso-entrada .aviso-cabecera { background-color: #BFE6FF !important; }
        .resumen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 15px;
            align-items: start;
        }
        .aviso {
            border: 1px solid #999;
            break-inside: avoid;
        }
        .aviso-cabecera {
            background-color: #CCFF00 !important;
            color: black;
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-bottom: 2px solid black;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .aviso-nombres {
            margin: 0;
            padding: 6px 10px 8px 10px;
            list-style: none;
            columns: 2;
            column-gap: 15px;
        }
        .aviso-nombres li {
            color: #000080;
            font-size: 12px;
            font-style: italic;
            padding: 2px 0;
            break-inside: avoid;
        }

        /* --- ESTILOS PARA IMPRESIÓN --- */
        @media print {
            @page { margin: 3mm; }
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .app-container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            #contenedor-horarios { display: flex; flex-wrap: wrap; gap: 15px; }
            .bloque-hora { width: 30%; font-size: 12px; padding: 0 10px; }
            /* Filas más compactas para que un bloque grande quepa en la primera hoja junto a la cabecera */
            .bloque-hora td { padding: 2px 2px; font-size: 11px; }
            .bloque-hora table { margin-top: 6px; }
            .cabecera-impresa { font-size: 13px; padding-bottom: 3px; margin-bottom: 8px; }
            /* El resumen siempre empieza en una hoja nueva: la última */
            #contenedor-resumen { break-before: page; page-break-before: always; border-top: none; margin-top: 0; padding-top: 0; }
            .resumen-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-right: 2px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="no-print">
        <h1>Visor Diario de Turnos</h1>

        <!-- Fecha del planificador y nombre del archivo cargado -->
        <div id="info-archivo" class="info-archivo"></div>

        <div class="instrucciones">Carga el planificador y elige tu sección y tu turno</div>

        <div class="controles">
            <label for="combo-seccion" style="font-weight: bold;">Sección:</label>
            <select id="combo-seccion">
                <option value="CARRUSEL PK ALM.">CARRUSEL PK ALM.</option>
                <option value="CARRUSEL PC ALM.">CARRUSEL PC ALM.</option>
                <option value="DEVOLUCIONES ALM.">DEVOLUCIONES ALM.</option>
                <option value="EXPEDICIONES ALM.">EXPEDICIONES ALM.</option>
            </select>

            <label for="combo-turno" style="font-weight: bold;">Turno:</label>
            <select id="combo-turno" style="width: 150px;">
                <option value="manana">☀️ Mañana</option>
                <option value="tarde">⛅ Tarde</option>
                <option value="noche">🌙 Noche</option>
            </select>

            <label for="archivo-planificador" class="btn btn-cargar" id="lbl-cargar">
                📂 Cargar planificador
            </label>
            <input type="file" id="archivo-planificador" accept=".xlsx, .xls">

            <button class="btn btn-imprimir" id="btn-imprimir" disabled onclick="window.print()">
                🖨️ Imprimir
            </button>
        </div>
    </div>

    <div id="cabecera-impresa" class="cabecera-impresa"></div>
    <div id="contenedor-horarios"></div>
    <div id="contenedor-resumen"></div>
</div>

<script>
    // --- VARIABLES GLOBALES PARA LA MEMORIA ---
    let datosExcelCrudos = [];
    let fechaPlanificador = "";

    const ABREVIACIONES = {
        "CARRUSEL PC ALM.": "CONF",
        "CARRUSEL PK ALM.": "PAQ",
        "EXPEDICIONES ALM.": "EXP",
        "DEVOLUCIONES ALM.": "DEVO"
    };

    const NOMBRES_TURNO = { manana: "Turno de mañana", tarde: "Turno de tarde", noche: "Turno de noche" };

    // Palabras que nunca deben quedar sueltas al final de un nombre recortado
    const PARTICULAS = ["DE", "DEL", "LA", "LAS", "LOS", "EL", "Y", "I", "DA", "DAS", "DO", "DOS", "DI", "VAN", "VON", "BEN", "SAN", "SANTA"];

    // Hueco máximo (minutos) para considerar que dos tareas van seguidas
    const HUECO_MAXIMO = 30;

    const comboSeccion = document.getElementById('combo-seccion');
    const comboTurno = document.getElementById('combo-turno');

    function escaparHtml(texto) {
        return String(texto).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    function formatTime(val) {
        if (val === undefined || val === null || val === "") return "";
        if (typeof val === 'number') {
            let totalMinutes = Math.round(val * 24 * 60);
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
        let s = String(val).trim();
        if (s.includes(' ')) s = s.split(' ').pop();
        let match = s.match(/(\d{1,2}):(\d{2})/);
        if (match) return `${match[1].padStart(2, '0')}:${match[2]}`;
        return s;
    }

    // Minutos desde las 06:00 (inicio lógico del día de trabajo)
    function calcularMinutosLogicos(horaStr) {
        if (!horaStr) return 9999;
        let partes = horaStr.split(':');
        if (partes.length < 2) return 9999;
        let h = parseInt(partes[0]);
        let m = parseInt(partes[1]);
        let hLogica = (h - 6 + 24) % 24;
        return hLogica * 60 + m;
    }

    // Igual, pero para horas de fin: las 06:00 son el final del día, no el principio
    function minutosDeFin(horaStr) {
        let m = calcularMinutosLogicos(horaStr);
        return m === 0 ? 1440 : m;
    }

    // Lee la fecha real del planificador (columna FECHA) en vez de usar la de hoy
    function extraerFecha(rows) {
        let fila = rows.find(r => r['fecha'] !== undefined && r['fecha'] !== "");
        if (!fila) return "";
        let val = fila['fecha'];
        let y, m, d;
        if (typeof val === 'number') {
            let f = XLSX.SSF.parse_date_code(val);
            if (!f) return "";
            y = f.y; m = f.m; d = f.d;
        } else {
            let s = String(val).trim();
            let iso = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
            let es = s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
            if (iso) { y = +iso[1]; m = +iso[2]; d = +iso[3]; }
            else if (es) { d = +es[1]; m = +es[2]; y = +es[3]; }
            else return "";
        }
        let fecha = new Date(y, m - 1, d);
        if (isNaN(fecha.getTime())) return "";
        let dia = fecha.toLocaleDateString('es-ES', { weekday: 'long' });
        let num = fecha.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        return `${dia} ${num}`;
    }

    // Nombre corto: se quita el segundo apellido, sin dejar partículas sueltas ("EL", "DEL"...)
    function acortarNombre(nombreCompleto) {
        let partes = nombreCompleto.split(/\s+/);
        if (partes.length >= 3) {
            partes.pop();
            while (partes.length > 2 && PARTICULAS.includes(partes[partes.length - 1])) partes.pop();
        }
        return partes.join(' ');
    }

    // --- MEMORIA DE LA ÚLTIMA SECCIÓN Y TURNO ELEGIDOS ---
    try {
        let s = localStorage.getItem('visor-seccion');
        let t = localStorage.getItem('visor-turno');
        if (s && [...comboSeccion.options].some(o => o.value === s)) comboSeccion.value = s;
        if (t && NOMBRES_TURNO[t]) comboTurno.value = t;
    } catch (e) { /* sin almacenamiento: se usan los valores por defecto */ }

    function actualizarVista() {
        try {
            localStorage.setItem('visor-seccion', comboSeccion.value);
            localStorage.setItem('visor-turno', comboTurno.value);
        } catch (e) { /* no es imprescindible */ }

        if (datosExcelCrudos.length === 0) return;

        const seccion = comboSeccion.value.trim().toUpperCase();
        const turno = comboTurno.value;
        const datos = extraerDatos(datosExcelCrudos, seccion, turno);

        let partesCabecera = [comboSeccion.value, NOMBRES_TURNO[turno]];
        if (fechaPlanificador) partesCabecera.push(fechaPlanificador);
        document.getElementById('cabecera-impresa').textContent = partesCabecera.join('  ·  ');

        renderizarPantalla(datos);
        renderizarResumen(datos);
    }

    comboSeccion.addEventListener('change', actualizarVista);
    comboTurno.addEventListener('change', actualizarVista);
    document.getElementById('archivo-planificador').addEventListener('change', manejarArchivo);

    function manejarArchivo(e) {
        const file = e.target.files[0];
        if (!file) return;

        const lbl = document.getElementById('lbl-cargar');
        const txtOriginal = lbl.innerHTML;
        lbl.innerHTML = "⏳ Procesando...";
        lbl.style.pointerEvents = 'none';

        const reader = new FileReader();
        reader.onload = function(evento) {
            try {
                if (typeof XLSX === 'undefined') {
                    throw new Error("No se ha podido cargar la librería de Excel (xlsx.full.min.js debe estar junto a index.html).");
                }
                const data = new Uint8Array(evento.target.result);
                const workbook = XLSX.read(data, {type: 'array', cellDates: false});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(worksheet, {defval: ""});

                const rows = rawRows.map(row => {
                    let newRow = {};
                    for (let key in row) newRow[key.trim().toLowerCase()] = row[key];
                    return newRow;
                });

                if (rows.length === 0 || !rows[0].hasOwnProperty('nombre empleado') || !rows[0].hasOwnProperty('hora inicio') || !rows[0].hasOwnProperty('hora fin')) {
                    throw new Error("Faltan columnas requeridas en el Excel.");
                }

                datosExcelCrudos = rows;
                fechaPlanificador = extraerFecha(rows);

                const textoFecha = fechaPlanificador ? escaparHtml(fechaPlanificador) : "no indicada en el archivo";
                document.getElementById('info-archivo').innerHTML =
                    `📅 Fecha del planificador: <strong>${textoFecha}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; 📁 Archivo: <strong>${escaparHtml(file.name)}</strong>`;

                actualizarVista();
                document.getElementById('btn-imprimir').disabled = false;
            } catch (err) {
                console.error(err);
                alert("Error al procesar: " + err.message);
            } finally {
                lbl.innerHTML = txtOriginal;
                lbl.style.pointerEvents = 'auto';
                e.target.value = '';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function extraerDatos(rows, seccionElegida, turno) {
        let df = rows.map(r => {
            let horaInicio = formatTime(r['hora inicio']);
            let horaFin = formatTime(r['hora fin']);
            let nombreCompleto = String(r['nombre empleado']).trim().toUpperCase().replace(/\s+/g, ' ');

            let tareaRaw = r['sección tarea'] ? String(r['sección tarea']).trim().toUpperCase() : "";
            if (['NAN', 'NAT', 'NULL', 'NONE'].includes(tareaRaw)) tareaRaw = "";

            return {
                nombreCompleto: nombreCompleto,
                horaInicio: horaInicio,
                horaFin: horaFin,
                tarea: tareaRaw,
                minutosOrden: calcularMinutosLogicos(horaInicio)
            };
        }).filter(r => r.nombreCompleto !== "" && r.horaInicio !== "" && r.horaFin !== "");

        // Se agrupa por nombre completo para no mezclar a dos personas con el mismo nombre corto
        let empDataMap = {};
        df.forEach(r => {
            if (!empDataMap[r.nombreCompleto]) empDataMap[r.nombreCompleto] = [];
            empDataMap[r.nombreCompleto].push(r);
        });

        // Si dos personas comparten nombre corto, se muestran con el nombre completo
        let vecesNombreCorto = {};
        Object.keys(empDataMap).forEach(n => {
            let corto = acortarNombre(n);
            vecesNombreCorto[corto] = (vecesNombreCorto[corto] || 0) + 1;
        });
        const nombreAMostrar = (n) => {
            let corto = acortarNombre(n);
            return vecesNombreCorto[corto] > 1 ? n : corto;
        };

        let resultado = [];

        const umbralTarde = calcularMinutosLogicos("14:00");
        const umbralNoche = calcularMinutosLogicos("22:00");

        for (let emp in empDataMap) {
            let empRows = empDataMap[emp].sort((a, b) => a.minutosOrden - b.minutosOrden);
            let trabajo = empRows;

            // Filas sin sección (como el descanso): heredan la de la fila anterior,
            // porque el descanso se hace en la sección en la que se estaba
            for (let i = 1; i < trabajo.length; i++) {
                if (trabajo[i].tarea === "") trabajo[i].tarea = trabajo[i-1].tarea;
            }
            for (let i = trabajo.length - 2; i >= 0; i--) {
                if (trabajo[i].tarea === "") trabajo[i].tarea = trabajo[i+1].tarea;
            }
            trabajo = trabajo.filter(r => r.tarea !== "");
            if (trabajo.length === 0) continue;

            // Bloques: tramos seguidos en la misma sección
            let bloques = [];
            trabajo.forEach(fila => {
                let ultimo = bloques[bloques.length - 1];
                let minInicio = calcularMinutosLogicos(fila.horaInicio);
                if (ultimo && fila.tarea === ultimo.tarea && minInicio - ultimo.minFin < HUECO_MAXIMO) {
                    ultimo.fin = fila.horaFin;
                    ultimo.minFin = minutosDeFin(fila.horaFin);
                } else {
                    bloques.push({
                        tarea: fila.tarea,
                        inicio: fila.horaInicio,
                        fin: fila.horaFin,
                        minInicio: minInicio,
                        minFin: minutosDeFin(fila.horaFin)
                    });
                }
            });

            bloques.forEach((b, idx) => {
                if (!b.tarea.includes(seccionElegida)) return;

                let anterior = bloques[idx - 1];
                let siguiente = bloques[idx + 1];

                // --- Inicio y fin a mostrar, recortados a los límites del turno ---
                let horaTurnoMostrar = b.inicio;
                let finMostrar = b.fin;
                let inicioRecortado = false;
                let finRecortado = false;

                if (turno === 'manana') {
                    if (b.minInicio >= umbralTarde) return;
                    if (b.minFin > umbralTarde) { finMostrar = "14:00"; finRecortado = true; }
                } else if (turno === 'tarde') {
                    if (b.minFin <= umbralTarde || b.minInicio >= umbralNoche) return;
                    if (b.minInicio < umbralTarde) { horaTurnoMostrar = "14:00"; inicioRecortado = true; }
                    if (b.minFin > umbralNoche) { finMostrar = "22:00"; finRecortado = true; }
                } else if (turno === 'noche') {
                    if (b.minFin <= umbralNoche) return;
                    if (b.minInicio < umbralNoche) { horaTurnoMostrar = "22:00"; inicioRecortado = true; }
                }

                // --- Salida: a qué sección va después ---
                let sig = "FIN TURNO";
                let sigHora = "";       // hora a la que empieza en la siguiente sección, si no es inmediata

                if (siguiente && !siguiente.tarea.includes(seccionElegida) && !finRecortado) {
                    let hueco = siguiente.minInicio - b.minFin;
                    let limiteTurno = turno === 'manana' ? umbralTarde : (turno === 'tarde' ? umbralNoche : Infinity);
                    // Si lo siguiente empieza ya en otro turno y tras un hueco largo, aquí acaba su jornada
                    let cruzaTurno = b.minFin < limiteTurno && siguiente.minInicio >= limiteTurno && hueco >= HUECO_MAXIMO;

                    if (!cruzaTurno) {
                        sig = ABREVIACIONES[siguiente.tarea] || siguiente.tarea;
                        if (hueco > 0) sigHora = siguiente.inicio;
                    }
                }

                // --- Llegada: de qué sección viene ---
                let desde = "";
                if (anterior && !anterior.tarea.includes(seccionElegida) && !inicioRecortado
                    && b.minInicio - anterior.minFin <= HUECO_MAXIMO) {
                    desde = ABREVIACIONES[anterior.tarea] || anterior.tarea;
                }

                resultado.push({
                    nombre: nombreAMostrar(emp),
                    horaTurno: horaTurnoMostrar,
                    fin: finMostrar,
                    sig: sig,
                    sigHora: sigHora,
                    desde: desde
                });
            });
        }
        return resultado;
    }

    function renderizarPantalla(datosParaPintar) {
        const contenedor = document.getElementById('contenedor-horarios');
        contenedor.innerHTML = "";

        if (datosParaPintar.length === 0) {
            contenedor.innerHTML = "<p style='text-align: center; color: #666; width: 100%; font-size: 18px;'>No hay nadie asignado a esta sección en este turno.</p>";
            return;
        }

        let turnos = {};
        datosParaPintar.forEach(r => {
            let h = r.horaTurno;
            if (!turnos[h]) turnos[h] = [];
            turnos[h].push(r);
        });

        let horasOrdenadas = Object.keys(turnos).sort((a, b) => {
            return calcularMinutosLogicos(a) - calcularMinutosLogicos(b);
        });

        horasOrdenadas.forEach(hora => {
            let listaDatos = turnos[hora];

            listaDatos.sort((a, b) => {
                let finA = minutosDeFin(a.fin);
                let finB = minutosDeFin(b.fin);

                if (finA !== finB) return finA - finB;
                if (a.sig !== b.sig) return a.sig.localeCompare(b.sig);
                return a.nombre.localeCompare(b.nombre);
            });

            let divBloque = document.createElement('div');
            divBloque.className = 'bloque-hora';

            let sigHtml = '';
            listaDatos.forEach(d => {
                let textoSig = "";
                if (d.sig !== "FIN TURNO") {
                    textoSig = `➔ Sig: ${escaparHtml(d.sig)}`;
                    if (d.sigHora) textoSig += ` (${escaparHtml(d.sigHora)})`;
                }

                sigHtml += `
                    <tr>
                        <td class="col-nombre">- ${escaparHtml(d.nombre)}</td>
                        <td class="col-fin">Fin: ${escaparHtml(d.fin)}</td>
                        <td class="col-sig">${textoSig}</td>
                    </tr>
                `;
            });

            divBloque.innerHTML = `
                <div class="hora-titulo">${escaparHtml(hora)} H (${listaDatos.length} pers.)</div>
                <table>${sigHtml}</table>
            `;

            contenedor.appendChild(divBloque);
        });
    }

    // Agrupa personas por una clave y devuelve los grupos ordenados por hora
    function agrupar(datos, obtenerGrupo) {
        let grupos = {};
        datos.forEach(d => {
            let g = obtenerGrupo(d);
            if (!g) return;
            if (!grupos[g.clave]) grupos[g.clave] = Object.assign({ nombres: [] }, g);
            if (!grupos[g.clave].nombres.includes(d.nombre)) grupos[g.clave].nombres.push(d.nombre);
        });
        return Object.values(grupos).sort((a, b) => (a.orden - b.orden) || a.clave.localeCompare(b.clave));
    }

    function pintarAvisos(lista, claseExtra) {
        return lista.map(g => {
            g.nombres.sort((a, b) => a.localeCompare(b));
            let nombresHtml = g.nombres.map(n => `<li>- ${escaparHtml(n)}</li>`).join('');
            let notaHtml = g.nota ? `<div class="aviso-nota">${escaparHtml(g.nota)}</div>` : '';
            return `
                <div class="aviso ${claseExtra}">
                    <div class="aviso-cabecera">
                        <span>${escaparHtml(g.titulo)}</span>
                        <span>${g.nombres.length} pers.</span>
                    </div>
                    ${notaHtml}
                    <ul class="aviso-nombres">${nombresHtml}</ul>
                </div>
            `;
        }).join('');
    }

    // Resumen para la última hoja: salidas y llegadas agrupadas por hora y sección,
    // para avisar a todo el grupo de una sola vez.
    function renderizarResumen(datos) {
        const contenedor = document.getElementById('contenedor-resumen');
        contenedor.innerHTML = "";

        let salidas = agrupar(datos, d => {
            if (d.sig === "FIN TURNO") return null;
            let nota = d.sigHora ? `Empiezan en ${d.sig} a las ${d.sigHora}` : "";
            return {
                clave: `${d.fin}|${d.sig}|${d.sigHora}`,
                orden: minutosDeFin(d.fin),
                titulo: `A las ${d.fin} H ➔ ${d.sig}`,
                nota: nota
            };
        });

        let llegadas = agrupar(datos, d => {
            if (!d.desde) return null;
            return {
                clave: `${d.horaTurno}|${d.desde}`,
                orden: calcularMinutosLogicos(d.horaTurno),
                titulo: `A las ${d.horaTurno} H ⬅ desde ${d.desde}`,
                nota: ""
            };
        });

        if (salidas.length === 0 && llegadas.length === 0) return;

        const cabecera = escaparHtml(document.getElementById('cabecera-impresa').textContent);
        let html = `<div class="cabecera-impresa">${cabecera}</div>`;

        if (salidas.length > 0) {
            html += `
                <p class="resumen-titulo">Salidas hacia otra sección</p>
                <p class="resumen-subtitulo">Personas que salen a la misma hora hacia la misma sección.</p>
                <div class="resumen-grid">${pintarAvisos(salidas, '')}</div>
            `;
        }
        if (llegadas.length > 0) {
            html += `
                <p class="resumen-titulo">Llegadas desde otra sección</p>
                <p class="resumen-subtitulo">Personas que llegan a esta sección a la misma hora desde la misma sección.</p>
                <div class="resumen-grid">${pintarAvisos(llegadas, 'aviso-entrada')}</div>
            `;
        }
        contenedor.innerHTML = html;
    }
</script>
